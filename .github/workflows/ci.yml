name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.6.0", "stable"]
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dart-lang/setup-dart@v1.7.1
        with:
          sdk: ${{ matrix.sdk }}
      - run: bash scripts/leak-scan.sh .
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Core has no dart:io outside env_io.dart
        run: |
          if grep -rn "dart:io" lib | grep -v "lib/src/env_io.dart"; then exit 1; fi
          dart compile js -o /tmp/web_check.js test/web_check.dart
      - name: Publish dry run
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
